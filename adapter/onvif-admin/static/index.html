<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ONVIF Admin</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  button { padding: 0.4rem 0.9rem; margin-right: 0.5rem; cursor: pointer; }
  input, select { padding: 0.35rem; margin: 0.15rem 0; box-sizing: border-box; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  .status { color: #666; font-size: 0.85rem; margin-top: 0.4rem; }
  .error { color: #c0392b; }
  .device-card {
    border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin: 0.5rem 0;
  }
  .device-card .meta { font-size: 0.85rem; color: #555; }
  .badge { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 1rem; background: #2a7d2a; color: #fff; margin-left: 0.35rem; }
  .badge-registered { background: #555; }
  .kvs-state { font-size: 0.8rem; padding: 0.1rem 0.5rem; border-radius: 1rem; color: #fff; white-space: nowrap; }
  .kvs-active { background: #2a7d2a; }
  .kvs-inactive { background: #999; }
  .kvs-failed { background: #c0392b; }
  .kvs-activating, .kvs-deactivating { background: #b8860b; }
  .ctl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-bottom: 0.3rem; }
  .ctl-row button { margin-right: 0; }
  .register-form { display: none; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed #ccc; }
  .register-form label { display: block; font-size: 0.8rem; color: #555; margin-top: 0.4rem; }
  .register-form input { width: 100%; }
  .preview-cell { width: 130px; }
  .preview-box {
    width: 120px; height: 68px; background: #000; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-box video { width: 100%; height: 100%; object-fit: cover; }
  .preview-box .preview-msg { color: #999; font-size: 0.7rem; text-align: center; padding: 0 4px; }
</style>
</head>
<body>

<h1>ONVIF Admin -- discover, register, control</h1>
<p class="status">Local tool, this LAN only. Separate from the cloud client -- WS-Discovery can't reach the cameras from there.</p>

<h2>1. Discover</h2>
<p>
  <label>ONVIF username <input id="scanUser" value="admin" size="10"></label>
  <label>Password <input id="scanPass" type="password" size="10"></label>
  <button onclick="scan()">Scan LAN</button>
  <span id="scanStatus" class="status"></span>
</p>
<div id="devices"></div>

<h2>2. Registered cameras</h2>
<button onclick="loadCameras()">Refresh</button>
<table id="camerasTable">
  <thead><tr><th>ID</th><th>Mode</th><th>IR</th><th>Host</th><th>Local preview</th><th>KVS push</th><th>Control</th></tr></thead>
  <tbody id="camerasBody"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
async function api(path, opts) {
  const r = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// Populated by loadCameras() -- maps an already-registered camera's ONVIF host to its
// cameraId, so a rescan of the same LAN can label a match as already-registered instead
// of presenting it as a brand new camera to add.
let registeredByHost = {};

async function scan() {
  const user = document.getElementById("scanUser").value;
  const password = document.getElementById("scanPass").value;
  const statusEl = document.getElementById("scanStatus");
  const devicesEl = document.getElementById("devices");
  statusEl.textContent = "scanning (a few seconds)...";
  devicesEl.innerHTML = "";
  await loadCameras(); // refresh registeredByHost before labeling scan results
  try {
    const data = await api("/api/scan", { method: "POST", body: JSON.stringify({ user, password }) });
    statusEl.textContent = `${data.devices.length} device(s) found`;
    data.devices.forEach((d, i) => devicesEl.appendChild(renderDevice(d, i)));
  } catch (e) {
    statusEl.textContent = "";
    devicesEl.innerHTML = `<p class="error">${e.message}</p>`;
  }
}

function renderDevice(d, i) {
  const div = document.createElement("div");
  div.className = "device-card";
  const details = d.details;
  const host = d.xaddr ? d.xaddr.split("://")[1].split("/")[0].split(":")[0] : "?";
  const port = d.xaddr && d.xaddr.includes(":") ? (d.xaddr.split("://")[1].split("/")[0].split(":")[1] || 80) : 80;
  const existingId = registeredByHost[host];

  div.innerHTML = `
    <div><strong>${details ? `${details.manufacturer} ${details.model}` : d.xaddr || "unknown"}</strong>
      ${details && details.has_ir_control ? '<span class="badge">IR control</span>' : ""}
      ${existingId ? `<span class="badge badge-registered">Registered as ${existingId}</span>` : ""}
    </div>
    <div class="meta">${d.xaddr || ""}</div>
    ${details ? `<div class="meta">Profile: ${details.profile} · Stream: ${details.stream_uri}</div>` : ""}
    ${d.enrichError ? `<div class="error meta">${d.enrichError}</div>` : ""}
    <p><button onclick="toggleForm(${i})">${existingId ? `Re-register ${existingId}` : "Register this camera"}</button></p>
    <div id="form-${i}" class="register-form">
      <label>Camera ID (e.g. cam-03) <input id="cid-${i}" placeholder="cam-03" value="${existingId || ""}" ${existingId ? "readonly" : ""}></label>
      <label>ONVIF host <input id="host-${i}" value="${host}"></label>
      <label>ONVIF port <input id="port-${i}" value="${port}"></label>
      <label>ONVIF username <input id="user-${i}" value="${document.getElementById('scanUser').value}"></label>
      <label>ONVIF password <input id="pass-${i}" type="password" value="${document.getElementById('scanPass').value}"></label>
      <label>RTSP stream URI <input id="uri-${i}" value="${details ? details.stream_uri : ''}"></label>
      <p><label><input type="checkbox" id="ir-${i}" ${details && details.has_ir_control ? "checked" : ""} style="width:auto"> Has IR control</label></p>
      <button onclick="register(${i})">${existingId ? "Re-register" : "Register"}</button>
      <span id="regStatus-${i}" class="status"></span>
    </div>`;
  return div;
}

function toggleForm(i) {
  const el = document.getElementById(`form-${i}`);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

async function register(i) {
  const statusEl = document.getElementById(`regStatus-${i}`);
  statusEl.textContent = "saving...";
  statusEl.className = "status";
  try {
    const result = await api("/api/cameras", {
      method: "POST",
      body: JSON.stringify({
        cameraId: document.getElementById(`cid-${i}`).value.trim(),
        host: document.getElementById(`host-${i}`).value.trim(),
        port: document.getElementById(`port-${i}`).value.trim(),
        user: document.getElementById(`user-${i}`).value,
        password: document.getElementById(`pass-${i}`).value,
        streamUri: document.getElementById(`uri-${i}`).value.trim(),
        hasIrControl: document.getElementById(`ir-${i}`).checked,
      }),
    });
    statusEl.textContent = result.updated ? "re-registered -- details updated." : "registered.";
    loadCameras();
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.className = "status error";
  }
}

// cameraId -> Hls instance (or a no-op stand-in for Safari's native HLS), for whichever
// rows currently have their preview toggled on. Kept out-of-band from the DOM since
// loadCameras() rebuilds the table wholesale on every refresh -- without this, a
// refresh would orphan any running player (still decoding/polling in the background
// with its <video> element already gone) instead of tearing it down first.
let previewPlayers = {};

function stopPreview(id) {
  if (previewPlayers[id]) {
    previewPlayers[id].destroy();
    delete previewPlayers[id];
  }
}

function togglePreview(id, mediamtxPath) {
  const box = document.getElementById(`previewBox-${id}`);
  const btn = document.getElementById(`previewBtn-${id}`);
  if (previewPlayers[id]) {
    stopPreview(id);
    box.innerHTML = `<span class="preview-msg">stopped</span>`;
    btn.textContent = "▶ Local preview";
    return;
  }
  box.innerHTML = `<video id="video-${id}" muted autoplay playsinline></video>`;
  btn.textContent = "■ Stop";
  const video = document.getElementById(`video-${id}`);
  // MediaMTX's own local HLS output (mediamtx.yml: hls: true, port 8888) -- not the
  // cloud KVS HLS path client/index.html uses. This shows the camera's live feed
  // directly, independent of whether this camera's KVS push is started or stopped:
  // MediaMTX keeps receiving from the camera continuously either way, so the preview
  // reflects "is the camera actually there and pointed right", not the Start/Stop
  // button's cloud-push state. Muxing is on-demand (hlsAlwaysRemux: false) and self-
  // closes after 60s unwatched, so toggling this off when done costs MediaMTX nothing.
  const url = `http://${window.location.hostname}:8888/${mediamtxPath}/index.m3u8`;
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) {
        box.innerHTML = `<span class="preview-msg">no signal</span>`;
        btn.textContent = "▶ Local preview";
        stopPreview(id);
      }
    });
    previewPlayers[id] = hls;
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    previewPlayers[id] = { destroy: () => {} };
  } else {
    box.innerHTML = `<span class="preview-msg">HLS not supported</span>`;
  }
}

let currentCameraIds = [];

async function loadCameras() {
  for (const id in previewPlayers) stopPreview(id);
  const body = document.getElementById("camerasBody");
  body.innerHTML = "<tr><td colspan=7>loading...</td></tr>";
  try {
    const data = await api("/api/cameras");
    registeredByHost = {};
    currentCameraIds = data.cameras.map(c => c.cameraId);
    for (const c of data.cameras) {
      if (c.onvifHost) registeredByHost[c.onvifHost] = c.cameraId;
    }
    body.innerHTML = "";
    for (const c of data.cameras) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${c.cameraId}</td>
        <td>${c.mode}</td>
        <td>${c.hasIrControl ? "yes" : "no"}</td>
        <td>${c.onvifHost || ""}</td>
        <td class="preview-cell">
          <div class="preview-box" id="previewBox-${c.cameraId}"><span class="preview-msg">no preview</span></div>
          <button id="previewBtn-${c.cameraId}" onclick="togglePreview('${c.cameraId}','${c.mediamtxPath}')" style="font-size:0.7rem; padding:0.15rem 0.4rem; margin-top:2px;">▶ Local preview</button>
        </td>
        <td><span id="kvsState-${c.cameraId}" class="kvs-state">…</span></td>
        <td>
          <div class="ctl-row">
            <button onclick="streamAction('${c.cameraId}','start')">Start Remote</button>
            <button onclick="streamAction('${c.cameraId}','stop')">Stop Remote</button>
          </div>
          ${c.hasIrControl ? `
          <div class="ctl-row">
            <button onclick="setIr('${c.cameraId}','AUTO')">IR Auto</button>
            <button onclick="setIr('${c.cameraId}','OFF')">IR Off</button>
            <button onclick="setIr('${c.cameraId}','ON')">IR On</button>
          </div>` : ""}
          <span id="ctlStatus-${c.cameraId}" class="status"></span>
        </td>`;
      body.appendChild(tr);
    }
    refreshAllStreamStatuses();
  } catch (e) {
    body.innerHTML = `<tr><td colspan=7 class="error">${e.message}</td></tr>`;
  }
}

// Queries systemctl (via GET /api/cameras/<id>/status) directly, not "what did the last
// button click do" -- this is what actually proves the KVS push is running or not,
// including catching a unit that crashed or was stopped by something other than this
// page. Polled continuously so it stays true even if you never touch the buttons.
async function refreshStreamStatus(id) {
  const el = document.getElementById(`kvsState-${id}`);
  if (!el) return; // row no longer in the DOM (e.g. mid table-rebuild)
  try {
    const data = await api(`/api/cameras/${id}/status`);
    el.textContent = data.state;
    el.className = "kvs-state kvs-" + data.state;
  } catch (e) {
    el.textContent = "?";
    el.className = "kvs-state";
  }
}

function refreshAllStreamStatuses() {
  for (const id of currentCameraIds) refreshStreamStatus(id);
}

setInterval(refreshAllStreamStatuses, 4000);

async function streamAction(id, action) {
  const el = document.getElementById(`ctlStatus-${id}`);
  el.textContent = "...";
  try {
    await api(`/api/cameras/${id}/${action}`, { method: "POST", body: "{}" });
    el.textContent = `${action} sent`;
    setTimeout(() => refreshStreamStatus(id), 1500); // give systemd a moment to transition
  } catch (e) {
    el.textContent = e.message;
  }
}

async function setIr(id, mode) {
  const el = document.getElementById(`ctlStatus-${id}`);
  el.textContent = "...";
  try {
    await api(`/api/cameras/${id}/ir`, { method: "POST", body: JSON.stringify({ mode }) });
    el.textContent = `IR: ${mode}`;
  } catch (e) {
    el.textContent = e.message;
  }
}

loadCameras();
</script>
</body>
</html>
