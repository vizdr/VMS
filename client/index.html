<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cam-01 / cam-02</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  #login, #app { display: none; }
  input { display: block; margin: 0.5rem 0; padding: 0.5rem; width: 100%; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
  .status { color: #666; font-size: 0.9rem; }
  /* Audio gets its own small panel: the two settings in it mean different things (one
     changes the stream for everyone, one only changes this browser) and sitting them
     loose among the buttons made that unreadable. */
  .setting-section {
    margin: 1rem 0; padding: 0.55rem 0.85rem;
    border: 1px solid #e0e0e0; border-radius: 6px; background: #fafafa;
  }
  .setting-section h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
  .audio-row {
    display: flex; align-items: baseline; gap: 0.45rem;
    margin: 0.25rem 0; cursor: pointer; line-height: 1.35; font-size: 0.9rem;
  }
  /* The global `input` rule above is written for the login form -- display:block,
     width:100%, padding. Applied to a checkbox it makes the box fill the whole row and
     pushes the label clean out of the panel, so every part of it has to be undone here
     explicitly; `flex: none` alone does not do it. */
  .audio-row input[type="checkbox"] {
    display: inline-block; width: auto; margin: 0; padding: 0;
    flex: none; position: relative; top: 2px;
  }
  .audio-row small { color: #666; }
  .audio-row.disabled { opacity: 0.55; cursor: default; }
  .setting-section > .status { margin: 0.4rem 0 0; }
  /* A <select> is not caught by the global `input` rule, but give it an explicit width
     anyway so it cannot inherit a full-row width from anything added later. */
  .setting-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
                 font-size: 0.9rem; margin: 0.15rem 0 0.35rem; }
  .setting-row select { width: auto; padding: 0.2rem 0.35rem; font-size: 0.9rem; margin: 0; }
  .setting-note { color: #666; font-size: 0.82rem; line-height: 1.4; }
  .video-wrap { position: relative; background: #000; aspect-ratio: 16 / 9; }
  video { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; background: #000; color: #ddd;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 1.5rem; box-sizing: border-box; font-size: 1rem;
    white-space: pre-line;
  }
  .overlay.hidden { display: none; }

  .camera-panel { margin-bottom: 3rem; padding-bottom: 1rem; border-bottom: 2px solid #ddd; }
  .camera-panel h2 { margin-bottom: 0.25rem; }
  .camera-subtitle { color: #888; font-size: 0.85rem; margin-top: 0; margin-bottom: 1rem; }

  .clips-section { margin-top: 1.5rem; }
  .clips-list { list-style: none; padding: 0; }
  .clips-list li {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.5rem 0; border-bottom: 1px solid #eee;
  }
  .tier-badge {
    font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 1rem;
    color: #fff; white-space: nowrap;
  }
  .tier-STANDARD { background: #2a7d2a; }
  .tier-STANDARD_IA { background: #b8860b; }
  .tier-DEEP_ARCHIVE, .tier-GLACIER { background: #444; }
  .tier-UNKNOWN { background: #999; }
  .clip-meta { flex: 1; font-size: 0.9rem; min-width: 10rem; }
  .clip-labels { color: #888; font-size: 0.8rem; }
  .clip-duration { color: #888; font-size: 0.85rem; }
  .tier-apply-status { font-size: 0.8rem; color: #888; }
  .clips-alert {
    display: none;                 /* only present when there is something to say */
    margin: 0.6rem 0;
    padding: 0.6rem 0.85rem;
    border: 1px solid #c0392b;
    border-left: 5px solid #c0392b;
    border-radius: 4px;
    background: #fdecea;
    color: #c0392b;
    font-size: 0.9rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="login">
  <h3>Sign in</h3>
  <input id="username" placeholder="username" autocomplete="username">
  <input id="password" type="password" placeholder="password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <div id="loginError" style="color:red"></div>
</div>

<div id="app">
  <!-- One .camera-panel block per camera, generated by renderCameraPanel() below --
       kept as a JS template rather than duplicated static HTML, since every function
       (load/cmd/record/clips) is parameterized by camera and would otherwise need a
       hand-maintained duplicate set of element IDs per camera. -->
  <div id="cameras"></div>

  <div id="clipPlayerSection" style="display:none">
    <h3>Clip player</h3>
    <video id="clipPlayer" controls muted style="width:100%; background:#000"></video>
    <p><button onclick="closeClipPlayer()">Stop &amp; close player</button></p>
    <div id="clipStatus" class="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const API = "https://svfvg7xh9g.execute-api.eu-central-1.amazonaws.com/prod";
const COGNITO_REGION = "eu-central-1";
const COGNITO_CLIENT_ID = "1r0n2cor1pgqvahfogs6cfno7s";

// Fetched from GET /cameras (backed by the "cameras" DynamoDB registry) after login,
// rather than hardcoded here -- a camera added through the registry shows up on next
// login with no client redeploy. "id" matches the KVS stream name / cameraId / systemd
// unit suffix (kvs-cam01.service etc, see agent.py's hyphen-stripping note) used
// throughout the backend.
let CAMERAS = [];

let idToken = null;
// Per-camera player/recording state, keyed by camera id -- populated once CAMERAS is
// fetched (see login()), since it used to be a handful of bare global variables back
// when this page only had one hardcoded camera.
const state = {};

function el(camera, base) { return document.getElementById(`${base}-${camera}`); }
function setStatus(camera, msg) { el(camera, "status").textContent = msg; }
function showOverlay(camera, msg) {
  const o = el(camera, "overlay");
  o.textContent = msg;
  o.classList.remove("hidden");
}
function hideOverlay(camera) { el(camera, "overlay").classList.add("hidden"); }

function teardownPlayer(camera) {
  const s = state[camera];
  clearTimeout(s.refreshTimer);
  s.refreshTimer = null;
  if (s.hls) { s.hls.destroy(); s.hls = null; }
  const v = el(camera, "video");
  v.onvolumechange = null;        // or it fires during load() and rewrites s.listen
  v.removeAttribute("src");
  v.load();
  // Stopping leaves nothing to listen to. s.listen is deliberately NOT cleared -- it is
  // the user's standing preference and is reapplied when a stream with sound comes back.
  setListenAvailable(camera, false);
}

// A KVS HLS session URL dies at `expires_in` seconds and cannot be revived -- every
// later request against it 403s. Refresh at 80% of that so a fresh session is playing
// before the old URL lapses. Without this the player ends up retrying a permanently
// dead URL: hls.js keeps failing, the <video> element sits in a "waiting" state, and
// the browser shows its own spinner forever while the last buffered seconds play out.
function scheduleSessionRefresh(camera, expiresIn) {
  const s = state[camera];
  clearTimeout(s.refreshTimer);
  const ms = Math.max(30, Math.floor((expiresIn || 300) * 0.8)) * 1000;
  s.refreshTimer = setTimeout(() => { if (!s.userStopped) load(camera); }, ms);
}

// One place for the mode wording, so the initial render and the post-save message can't
// drift apart. The stream caveat matters: the event watcher publishes a clip trigger on
// detection, but clip_to_s3 pulls from KVS, which only has footage while the producer is
// running -- a detection with the stream stopped produces nothing.
function recModeHint(mode, supportsDetection) {
  if (!supportsDetection) return "no ONVIF — manual only";
  if (!mode || mode === "manual") return "manual only — use Start Recording";
  return `${mode} detection armed — a clip is written ~40 s after a detection (post-roll + processing), then announced below within 30 s. Requires the stream to be running.`;
}

// One place for the audio wording, same reasoning as recModeHint(). The "next Start"
// caveat is not a UI nicety and must not be softened: the producer reads audioEnabled
// once at startup and never re-reads, because KVS rejects a stream whose fragments
// change from video-only to audio+video mid-stream ("Track changes aren't supported" --
// GetClip and GetHLSStreamingSessionURL both). Applying this live would break clips
// across the boundary, so a restart is the correct behaviour, not a limitation.
// Must stay in step with VALID_LIMITS in set_camera_outage_buffer.py and
// adapter/outage_buffer.py. The disk figures are for cam-01 with audio (the expensive
// case, ~1.26 Mbps measured) and are shown because 24 h is 13.6 GB of a 57 GB stick --
// a number worth seeing before choosing it, not after.
const OUTAGE_LIMITS = [
  { sec: 0,     label: "Off" },
  { sec: 30,    label: "30 seconds" },
  { sec: 120,   label: "2 minutes" },
  { sec: 300,   label: "5 minutes" },
  { sec: 600,   label: "10 minutes" },
  { sec: 1800,  label: "30 minutes" },
  { sec: 3600,  label: "1 hour  (~570 MB)" },
  { sec: 18000, label: "5 hours  (~2.8 GB)" },
  { sec: 43200, label: "12 hours  (~6.8 GB)" },
  { sec: 86400, label: "24 hours  (~13.6 GB)" },
];

// Evidence clips are 45s and read fine as "45 sec.". Outage-buffer chunks run to 2 hours,
// which rendered as "7200 sec." -- technically correct and unreadable.
function formatDuration(sec) {
  sec = Number(sec);
  if (sec < 90) return `${sec} sec.`;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (!h) return `${m} min.`;
  return m ? `${h} h ${m} min.` : `${h} h`;
}

function outageLabel(sec) {
  const m = OUTAGE_LIMITS.find(o => o.sec === Number(sec));
  return m ? m.label.replace(/\s*\(.*\)$/, "") : `${sec}s`;
}

function outageHint(sec) {
  if (!Number(sec)) return "off — footage is lost if the connection drops for more than ~2 minutes";
  return `on — up to ${outageLabel(sec)} after a drop, plus the 2 minutes before it`;
}

function audioHint(enabled, capable) {
  if (!capable) return "this camera has no microphone";
  return enabled
    ? "microphone is included — you can hear it live and in clips"
    : "video only — no microphone in the live view or in clips";
}

// "Include microphone" and "Listen here" are deliberately two controls, because they are
// two different things and conflating them confuses people:
//
//   Include microphone -> whether audio exists in the KVS stream at all. Affects the live
//                         view AND every clip. Costs bandwidth. Applies on next Start.
//   Listen here        -> whether THIS browser plays that audio out loud. Local only,
//                         instant, affects nobody else, costs nothing.
//
// The second is useless without the first, so it stays disabled until the player reports
// an audio track actually present in the stream it is playing.
function setListenAvailable(camera, available) {
  const box = document.getElementById(`listen-${camera}`);
  const lbl = document.getElementById(`listenLabel-${camera}`);
  const hint = document.getElementById(`listenHint-${camera}`);
  if (!box || !lbl) return;
  box.disabled = !available;
  lbl.classList.toggle("disabled", !available);
  if (hint) {
    hint.textContent = available
      ? "— your speakers only; changes nothing for anyone else"
      : "— no sound in this stream · tick Record microphone, then Stop and Start";
  }
  if (!available) { box.checked = false; return; }
  // Restore the choice across a session refresh: load() re-attaches the player roughly
  // hourly (scheduleSessionRefresh), and silently re-muting each time would look like
  // the audio had cut out.
  const s = state[camera];
  if (s && s.listen) { box.checked = true; setListen(camera, true); }
}

function setListen(camera, on) {
  const v = el(camera, "video");
  const s = state[camera];
  if (!v) return;
  // Browsers block unmuted autoplay, which is why the player starts muted. Unmuting from
  // inside a change handler is fine: the click is the user gesture that permits it.
  v.muted = !on;
  if (on && v.paused) v.play().catch(() => {});
  if (s) s.listen = on;   // survives the session-refresh reload (see load())
}

// Detection-created clips arrive without the page doing anything, so unlike manual
// recording there is no local event to refresh the list on. Poll only to *notice* them
// and raise a hint -- deliberately not reloading the list underneath the user, which
// would reset a tier dropdown or a scroll position mid-interaction.
function syncClipPolling(camera, mode) {
  const s = state[camera];
  if (!s) return;
  clearInterval(s.clipsTimer);
  s.clipsTimer = null;
  if (mode && mode !== "manual") {
    s.clipsTimer = setInterval(() => checkForNewClips(camera), 30000);
  }
}

// Compares the newest clip on the server against the newest one currently rendered.
async function checkForNewClips(camera) {
  const s = state[camera];
  const alertEl = document.getElementById(`clipsAlert-${camera}`);
  if (!s || !alertEl) return;
  try {
    const r = await fetch(`${API}/clips?camera=${camera}`, { headers: { Authorization: idToken } });
    if (!r.ok) return;
    const data = await r.json();
    const newest = data.clips.length ? data.clips[0].startTs : null;
    // renderedLatest === null means the rendered list was empty, so the first clip to
    // arrive is still news -- don't require a previous value
    if (newest && newest !== s.renderedLatest) {
      alertEl.textContent = "New clips are available. Refresh to watch.";
      alertEl.style.display = "block";
    }
  } catch (e) { /* transient; the next tick retries */ }
}

function renderCameraPanel(cam) {
  const div = document.createElement("div");
  div.className = "camera-panel";
  const modeLabel = cam.mode === "passthrough" ? "ONVIF, passthrough" : "USB, transcoded";
  div.innerHTML = `
    <h2>${cam.id}</h2>
    <p class="camera-subtitle">${modeLabel}${cam.hasIrControl ? " · IR control" : ""}</p>
    <div class="video-wrap">
      <video id="video-${cam.id}" controls autoplay muted playsinline></video>
      <div id="overlay-${cam.id}" class="overlay">Press Start to begin watching</div>
    </div>
    <p>
      <button onclick="cmd('${cam.id}','start')">Start</button>
      <button onclick="cmd('${cam.id}','stop')">Stop</button>
      <button onclick="load('${cam.id}')">Reload player</button>
    </p>
    <div id="status-${cam.id}" class="status"></div>

    ${cam.hasIrControl ? `
    <p>
      IR illumination:
      <button onclick="setIrMode('${cam.id}','AUTO')">Auto</button>
      <button onclick="setIrMode('${cam.id}','OFF')">Force Day (IR off)</button>
      <button onclick="setIrMode('${cam.id}','ON')">Force Night (IR on)</button>
      <span id="irStatus-${cam.id}" class="status"></span>
    </p>` : ""}

    <p>
      Recording mode:
      <select id="recMode-${cam.id}" onchange="setRecordingMode('${cam.id}', this.value)"
              ${cam.supportsDetection ? "" : "disabled"}>
        <option value="manual">Manual only</option>
        <option value="motion">Motion detected</option>
        <option value="cellMotion">Motion in zones (cell grid)</option>
        <option value="human">Human detected</option>
      </select>
      <span id="recModeStatus-${cam.id}" class="status">${recModeHint(cam.recordingMode, cam.supportsDetection)}</span>
    </p>

    <div class="setting-section">
      <h3>Audio</h3>

      <label class="audio-row ${cam.audioCapable ? "" : "disabled"}" id="audioLabel-${cam.id}">
        <input type="checkbox" id="audio-${cam.id}"
               onchange="setAudio('${cam.id}', this.checked)"
               ${cam.audioCapable ? "" : "disabled"}>
        <span><strong>Record microphone</strong> <small>${cam.audioCapable
          ? "— into the live view and clips, for everyone · applies on next Start"
          : "— this camera has no microphone"}</small></span>
      </label>

      <label class="audio-row disabled" id="listenLabel-${cam.id}">
        <input type="checkbox" id="listen-${cam.id}"
               onchange="setListen('${cam.id}', this.checked)" disabled>
        <span><strong>Play sound here</strong> <small id="listenHint-${cam.id}">— needs a running stream that has sound</small></span>
      </label>

      <div id="audioStatus-${cam.id}" class="status">${audioHint(cam.audioEnabled, cam.audioCapable)}</div>
    </div>

    <div class="setting-section">
      <h3>If the internet drops</h3>
      <div class="setting-row">
        <label for="outage-${cam.id}">Keep recording locally for</label>
        <select id="outage-${cam.id}" onchange="setOutageBuffer('${cam.id}', this.value)">
          ${OUTAGE_LIMITS.map(o => `<option value="${o.sec}">${o.label}</option>`).join("")}
        </select>
      </div>
      <div class="setting-note">
        Footage is buffered to the USB drive while AWS is unreachable, then uploaded to
        <em>Evidence clips</em> when the connection returns. The <strong>2 minutes before
        the drop</strong> are always included on top of the time you choose. Only runs
        while this camera is streaming.
      </div>
      <div id="outageStatus-${cam.id}" class="status">${outageHint(cam.outageBufferSec)}</div>
    </div>

    <p>
      <button id="recordBtn-${cam.id}" onclick="toggleRecording('${cam.id}')">&#9679; Start Recording</button>
      <span id="recordStatus-${cam.id}" class="status"></span>
    </p>

    <div class="clips-section">
      <h3>Evidence clips
        <button onclick="loadClips('${cam.id}')" style="font-size:0.8rem">Refresh</button>
      </h3>
      <div id="clipsAlert-${cam.id}" class="clips-alert"></div>
      <ul id="clipsList-${cam.id}" class="clips-list"></ul>
    </div>`;
  return div;
}

const TIER_LABEL = {
  STANDARD: "Standard", STANDARD_IA: "Standard-IA",
  DEEP_ARCHIVE: "Deep Archive", GLACIER: "Glacier", UNKNOWN: "Unknown",
};

// Cognito's InitiateAuth is a plain JSON HTTPS API -- no SDK needed, keeps this a
// single self-contained file. See: https://docs.aws.amazon.com/cognito/latest/developerguide/API_InitiateAuth.html
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("loginError");
  errorEl.textContent = "";
  try {
    const r = await fetch(`https://cognito-idp.${COGNITO_REGION}.amazonaws.com/`, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-amz-json-1.1",
        "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
      },
      body: JSON.stringify({
        AuthFlow: "USER_PASSWORD_AUTH",
        ClientId: COGNITO_CLIENT_ID,
        AuthParameters: { USERNAME: username, PASSWORD: password },
      }),
    });
    const data = await r.json();
    if (!r.ok || !data.AuthenticationResult) {
      errorEl.textContent = data.message || "Sign-in failed";
      return;
    }
    idToken = data.AuthenticationResult.IdToken;

    const camerasDiv = document.getElementById("cameras");
    camerasDiv.innerHTML = "<p>Loading cameras…</p>";
    const cr = await fetch(`${API}/cameras`, { headers: { Authorization: idToken } });
    const cdata = await cr.json();
    if (!cr.ok) {
      errorEl.textContent = "Could not load camera list: " + (cdata.error || cr.status);
      return;
    }
    CAMERAS = cdata.cameras;

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";

    camerasDiv.innerHTML = "";
    for (const cam of CAMERAS) {
      state[cam.id] = { hls: null, userStopped: true, recording: false, recordingStartTs: null,
                        recordingTimer: null, refreshTimer: null, netRetries: 0,
                        clipsTimer: null, renderedLatest: null, listen: false,
                        outageBufferSec: cam.outageBufferSec || 0 };
      camerasDiv.appendChild(renderCameraPanel(cam));
      // The <select> is built via innerHTML, so the stored value has to be applied after
      // the node is in the DOM rather than as a `selected` attribute in the template.
      const sel = document.getElementById(`recMode-${cam.id}`);
      if (sel) sel.value = cam.recordingMode || "manual";
      const aud = document.getElementById(`audio-${cam.id}`);
      if (aud) aud.checked = !!cam.audioEnabled;
      const ob = document.getElementById(`outage-${cam.id}`);
      if (ob) ob.value = String(cam.outageBufferSec || 0);
      syncClipPolling(cam.id, cam.recordingMode);
      loadClips(cam.id);
    }
  } catch (e) {
    errorEl.textContent = "Network error: " + e.message;
  }
}

async function load(camera) {
  setStatus(camera, "loading stream...");
  showOverlay(camera, "Loading stream…");
  try {
    const r = await fetch(`${API}/hls?stream=${camera}`, { headers: { Authorization: idToken } });
    const data = await r.json();
    if (!r.ok) {
      setStatus(camera, "error: " + (data.error || r.status));
      showOverlay(camera, (data.error || "Could not load stream") + "\n\nPress Start to begin.");
      return;
    }
    const { url } = data;
    const v = el(camera, "video");
    const s = state[camera];

    if (s.hls) { s.hls.destroy(); s.hls = null; }
    clearTimeout(s.refreshTimer);
    s.userStopped = false;
    s.netRetries = 0;

    // Every reload starts muted and unavailable; MANIFEST_PARSED below re-enables it if
    // the stream really does carry sound. Assuming from the registry flag instead would
    // be wrong -- the flag can have been changed since this producer was started.
    v.muted = true;
    setListenAvailable(camera, false);

    if (Hls.isSupported()) {
      s.hls = new Hls();
      s.hls.loadSource(url);
      s.hls.attachMedia(v);
      s.hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
        setListenAvailable(camera, !!(data.audioTracks && data.audioTracks.length));
      });
      s.hls.on(Hls.Events.FRAG_BUFFERED, () => { hideOverlay(camera); s.netRetries = 0; });
      s.hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (s.userStopped) return;
        setStatus(camera, "player error: " + data.details);
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            // Usually the KVS session URL having expired, which startLoad() can never
            // fix -- it just re-requests the same dead URL. Allow a couple of retries
            // for genuinely transient blips, then go get a whole new session. The
            // overlay matters too: without it the only feedback is the browser's own
            // spinner, which looks identical to "still buffering".
            if (++s.netRetries <= 2) {
              s.hls.startLoad();
            } else {
              s.netRetries = 0;
              showOverlay(camera, "Reconnecting…");
              clearTimeout(s.refreshTimer);
              s.refreshTimer = setTimeout(() => { if (!s.userStopped) load(camera); }, 1000);
            }
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            s.hls.recoverMediaError();
            break;
          default:
            showOverlay(camera, "Playback error (" + data.details + ")\n\nPress Reload player to retry.");
        }
      });
    } else {
      // Native HLS (Safari). There is no manifest event here, so ask the element once it
      // has metadata. audioTracks is the standard answer; webkitAudioDecodedByteCount is
      // the fallback for the browsers that never implemented it.
      v.src = url;
      v.addEventListener("loadedmetadata", () => {
        const n = v.audioTracks ? v.audioTracks.length
                                : (v.webkitAudioDecodedByteCount > 0 ? 1 : 0);
        setListenAvailable(camera, n > 0);
      }, { once: true });
      hideOverlay(camera);
    }
    // The <video> has native controls, so the user can mute from there too. Mirror it
    // back, or the checkbox starts lying about what they can hear.
    v.onvolumechange = () => {
      const box = document.getElementById(`listen-${camera}`);
      if (box && !box.disabled) { box.checked = !v.muted; s.listen = !v.muted; }
    };
    scheduleSessionRefresh(camera, data.expires_in);
    setStatus(camera, "stream loaded");
  } catch (e) {
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Error loading stream.\n\nPress Reload player to retry.");
  }
}

async function cmd(camera, action) {
  setStatus(camera, `sending ${action}...`);
  const s = state[camera];
  if (action === "stop") {
    s.userStopped = true;
    teardownPlayer(camera);
    showOverlay(camera, "Stream stopped.\n\nPress Start to watch again.");
  } else {
    showOverlay(camera, "Starting stream…\nThis can take a few seconds.");
  }
  try {
    const r = await fetch(`${API}/cmd`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ action, camera }),
    });
    const data = await r.json();
    setStatus(camera, r.ok ? `${action} sent` : "error: " + (data.error || r.status));
    if (!r.ok) { showOverlay(camera, "Could not send " + action + ": " + (data.error || r.status)); return; }
    if (action === "start") setTimeout(() => load(camera), 8000);
  } catch (e) {
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Network error sending " + action + ".\n\nPress Start to try again.");
  }
}

// Writes recordingMode to the registry. The event watcher (kvs-event-watcher.service on
// the Pi) polls that registry and re-subscribes within ~60s, so a change here really does
// change recording behaviour -- see recModeHint() for the caveat the status text carries.
async function setRecordingMode(camera, mode) {
  const el = document.getElementById(`recModeStatus-${camera}`);
  el.textContent = "saving…";
  try {
    const r = await fetch(`${API}/cameras/mode`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ cameraId: camera, recordingMode: mode }),
    });
    const data = await r.json();
    if (!r.ok) { el.textContent = "error: " + (data.error || r.status); return; }
    el.textContent = `saved — ${recModeHint(mode, true)}`;
    syncClipPolling(camera, mode);
  } catch (e) {
    el.textContent = "error: " + e.message;
  }
}

// Writes audioEnabled to the registry. Unlike setRecordingMode, nothing picks this up
// while the producer runs -- see audioHint() -- so the message says so explicitly, and
// says it differently depending on whether a stream is currently up.
async function setAudio(camera, enabled) {
  const el = document.getElementById(`audioStatus-${camera}`);
  const box = document.getElementById(`audio-${camera}`);
  el.textContent = "saving…";
  try {
    const r = await fetch(`${API}/cameras/audio`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ cameraId: camera, audioEnabled: enabled }),
    });
    const data = await r.json();
    if (!r.ok) {
      // Put the box back where the server says it is, so the UI can't claim a setting
      // that was refused.
      if (box) box.checked = !enabled;
      el.textContent = "error: " + (data.error || r.status);
      return;
    }
    const target = enabled ? "sound will be recorded" : "video only";
    // userStopped starts true and is cleared by Start, so this is "did this page start
    // the stream" rather than proof of producer state -- it can be started from the
    // local admin GUI too. Phrased as a prompt, not an assertion, for that reason.
    el.textContent = state[camera] && !state[camera].userStopped
      ? `Saved — ${target} from the next Start. Press Stop then Start to apply it now.`
      : `Saved — ${target} from the next Start.`;
  } catch (e) {
    if (box) box.checked = !enabled;
    el.textContent = "error: " + e.message;
  }
}

// Unlike the audio flag, this one needs no restart: the supervisor on the Pi re-reads the
// registry every 60s and arms or disarms MediaMTX recording in place. What it cannot do
// is buffer a camera whose producer is stopped -- with no producer there is no cloud
// stream to protect -- which is why the note says "only while this camera is streaming".
async function setOutageBuffer(camera, secs) {
  const el = document.getElementById(`outageStatus-${camera}`);
  const sel = document.getElementById(`outage-${camera}`);
  const previous = state[camera] ? state[camera].outageBufferSec : 0;
  el.textContent = "saving…";
  try {
    const r = await fetch(`${API}/cameras/outage-buffer`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ cameraId: camera, outageBufferSec: Number(secs) }),
    });
    const data = await r.json();
    if (!r.ok) {
      if (sel) sel.value = String(previous);   // never show a setting the server refused
      el.textContent = "error: " + (data.error || r.status);
      return;
    }
    if (state[camera]) state[camera].outageBufferSec = Number(secs);
    el.textContent = `Saved — ${outageHint(secs)}. Takes effect within a minute.`;
  } catch (e) {
    if (sel) sel.value = String(previous);
    el.textContent = "error: " + e.message;
  }
}

async function setIrMode(camera, mode) {
  const statusEl = document.getElementById(`irStatus-${camera}`);
  statusEl.textContent = `setting ${mode}...`;
  try {
    const r = await fetch(`${API}/cmd`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ action: "ir", camera, mode }),
    });
    const data = await r.json();
    statusEl.textContent = r.ok ? `IR mode: ${mode}` : "error: " + (data.error || r.status);
  } catch (e) {
    statusEl.textContent = "error: " + e.message;
  }
}

function toggleRecording(camera) {
  state[camera].recording ? stopRecording(camera) : startRecording(camera);
}

function startRecording(camera) {
  const s = state[camera];
  s.recording = true;
  s.recordingStartTs = new Date();
  const btn = document.getElementById(`recordBtn-${camera}`);
  btn.textContent = "■ Stop Recording";
  btn.style.background = "#c0392b";
  btn.style.color = "#fff";

  const statusEl = document.getElementById(`recordStatus-${camera}`);
  s.recordingTimer = setInterval(() => {
    const secs = Math.floor((new Date() - s.recordingStartTs) / 1000);
    statusEl.textContent = `Recording… ${secs}s`;
  }, 1000);
}

async function stopRecording(camera) {
  const s = state[camera];
  s.recording = false;
  clearInterval(s.recordingTimer);
  const endTs = new Date();
  const btn = document.getElementById(`recordBtn-${camera}`);
  const statusEl = document.getElementById(`recordStatus-${camera}`);
  btn.textContent = "● Start Recording";
  btn.style.background = "";
  btn.style.color = "";
  statusEl.textContent = "Saving recording…";

  try {
    const r = await fetch(`${API}/clips/record`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({
        stream: camera,
        startTs: s.recordingStartTs.toISOString(),
        endTs: endTs.toISOString(),
      }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = "Error saving recording: " + (data.error || r.status);
      return;
    }
    statusEl.textContent = "Recording saved.";
    loadClips(camera);
  } catch (e) {
    statusEl.textContent = "Network error saving recording: " + e.message;
  }
}

async function loadClips(camera) {
  const list = document.getElementById(`clipsList-${camera}`);
  list.innerHTML = "<li>Loading…</li>";
  try {
    const r = await fetch(`${API}/clips?camera=${camera}`, { headers: { Authorization: idToken } });
    const data = await r.json();
    if (!r.ok) { list.innerHTML = `<li>Error: ${data.error || r.status}</li>`; return; }
    // remember the newest rendered clip so checkForNewClips() can spot arrivals, and
    // clear any pending hint since the list is now current
    state[camera].renderedLatest = data.clips.length ? data.clips[0].startTs : null;
    const alertEl = document.getElementById(`clipsAlert-${camera}`);
    if (alertEl) { alertEl.textContent = ""; alertEl.style.display = "none"; }

    if (data.clips.length === 0) { list.innerHTML = "<li>No clips yet.</li>"; return; }

    list.innerHTML = "";
    for (const clip of data.clips) {
      const li = document.createElement("li");
      const when = new Date(clip.startTs).toLocaleString();
      const tierClass = "tier-" + clip.tier;
      const tierText = TIER_LABEL[clip.tier] || clip.tier;
      const restoreNote = clip.restoring ? " (restoring…)" : "";
      const duration = clip.durationSec != null ? formatDuration(clip.durationSec) : "duration unknown";
      li.innerHTML = `
        <span class="tier-badge ${tierClass}">${tierText}${restoreNote}</span>
        <span class="clip-meta">${when}
          <span class="clip-duration">· ${duration}</span>
          <span class="clip-labels">${(clip.labels || []).join(", ")}</span>
        </span>
        <select class="tier-select">
          <option value="STANDARD">Standard</option>
          <option value="STANDARD_IA">Standard-IA</option>
          <option value="DEEP_ARCHIVE">Deep Archive</option>
        </select>
        <button class="tier-apply-btn">Apply</button>
        <button class="play-btn">Play</button>
        <button class="delete-btn" style="background:#c0392b; color:#fff">Delete</button>
        <span class="tier-apply-status"></span>`;
      li.querySelector(".tier-select").value =
        (clip.tier === "GLACIER" ? "DEEP_ARCHIVE" : clip.tier) || "STANDARD";
      li.querySelector(".tier-apply-btn").onclick =
        () => setClipTier(clip.s3Key, li.querySelector(".tier-select").value, li, camera);
      li.querySelector(".delete-btn").onclick =
        () => deleteClip(clip.s3Key, clip.startTs, when, li, camera);
      li.querySelector(".play-btn").onclick = () => playClip(clip.s3Key);
      list.appendChild(li);
    }
  } catch (e) {
    list.innerHTML = `<li>Error: ${e.message}</li>`;
  }
}

async function setClipTier(s3Key, tier, li, camera) {
  const statusEl = li.querySelector(".tier-apply-status");
  statusEl.textContent = "Applying…";
  try {
    const r = await fetch(`${API}/clips/tier`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key, tier }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = data.error || `Error (${r.status})`;
      return;
    }
    statusEl.textContent = "Done.";
    loadClips(camera);
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

async function deleteClip(s3Key, startTs, when, li, camera) {
  if (!confirm(`Delete the clip from ${when}?\n\nThis cannot be undone.`)) return;

  const statusEl = li.querySelector(".tier-apply-status");
  statusEl.textContent = "Deleting…";
  try {
    const r = await fetch(`${API}/clips/delete`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key, startTs }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = "Error: " + (data.error || r.status);
      return;
    }
    closeClipPlayer();
    li.remove();
    const list = document.getElementById(`clipsList-${camera}`);
    if (list.children.length === 0) list.innerHTML = "<li>No clips yet.</li>";
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

// One shared player for saved clips, regardless of which camera panel's Play button
// was pressed -- only one clip is ever being reviewed at a time, so a per-camera
// player would just be two empty players sitting around.
async function playClip(s3Key) {
  const section = document.getElementById("clipPlayerSection");
  const player = document.getElementById("clipPlayer");
  const statusEl = document.getElementById("clipStatus");
  section.style.display = "block";
  player.pause(); player.removeAttribute("src"); player.load();
  statusEl.textContent = "Loading clip…";
  section.scrollIntoView({ behavior: "smooth" });

  try {
    const r = await fetch(`${API}/clips/play`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key }),
    });
    const data = await r.json();
    if (!r.ok && r.status !== 202) {
      statusEl.textContent = "Error: " + (data.error || r.status);
      return;
    }
    if (data.status === "ready") {
      player.src = data.url;
      statusEl.textContent = "";
      player.play().catch(() => {
        statusEl.textContent = "Loaded -- press the player's play button to watch.";
      });
    } else if (data.status === "restore_requested") {
      statusEl.textContent = `This clip is in Deep Archive and wasn't readable directly. ` +
        `A restore has been requested -- check back in about ${data.eta_hours} hours ` +
        `and press Play again.`;
    } else if (data.status === "restoring") {
      statusEl.textContent = `Restore already in progress -- check back in about ` +
        `${data.eta_hours} hours and press Play again.`;
    }
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

function closeClipPlayer() {
  const player = document.getElementById("clipPlayer");
  player.pause();
  player.removeAttribute("src");
  player.load();
  document.getElementById("clipStatus").textContent = "";
  document.getElementById("clipPlayerSection").style.display = "none";
}

document.getElementById("login").style.display = "block";
</script>
</body>
