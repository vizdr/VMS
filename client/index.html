<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cam-01 / cam-02</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  #login, #app { display: none; }
  input { display: block; margin: 0.5rem 0; padding: 0.5rem; width: 100%; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
  .status { color: #666; font-size: 0.9rem; }
  .video-wrap { position: relative; background: #000; aspect-ratio: 16 / 9; }
  video { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; background: #000; color: #ddd;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 1.5rem; box-sizing: border-box; font-size: 1rem;
    white-space: pre-line;
  }
  .overlay.hidden { display: none; }

  .camera-panel { margin-bottom: 3rem; padding-bottom: 1rem; border-bottom: 2px solid #ddd; }
  .camera-panel h2 { margin-bottom: 0.25rem; }
  .camera-subtitle { color: #888; font-size: 0.85rem; margin-top: 0; margin-bottom: 1rem; }

  .clips-section { margin-top: 1.5rem; }
  .clips-list { list-style: none; padding: 0; }
  .clips-list li {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.5rem 0; border-bottom: 1px solid #eee;
  }
  .tier-badge {
    font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 1rem;
    color: #fff; white-space: nowrap;
  }
  .tier-STANDARD { background: #2a7d2a; }
  .tier-STANDARD_IA { background: #b8860b; }
  .tier-DEEP_ARCHIVE, .tier-GLACIER { background: #444; }
  .tier-UNKNOWN { background: #999; }
  .clip-meta { flex: 1; font-size: 0.9rem; min-width: 10rem; }
  .clip-labels { color: #888; font-size: 0.8rem; }
  .clip-duration { color: #888; font-size: 0.85rem; }
  .tier-apply-status { font-size: 0.8rem; color: #888; }
</style>
</head>
<body>

<div id="login">
  <h3>Sign in</h3>
  <input id="username" placeholder="username" autocomplete="username">
  <input id="password" type="password" placeholder="password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <div id="loginError" style="color:red"></div>
</div>

<div id="app">
  <!-- One .camera-panel block per camera, generated by renderCameraPanel() below --
       kept as a JS template rather than duplicated static HTML, since every function
       (load/cmd/record/clips) is parameterized by camera and would otherwise need a
       hand-maintained duplicate set of element IDs per camera. -->
  <div id="cameras"></div>

  <div id="clipPlayerSection" style="display:none">
    <h3>Clip player</h3>
    <video id="clipPlayer" controls muted style="width:100%; background:#000"></video>
    <p><button onclick="closeClipPlayer()">Stop &amp; close player</button></p>
    <div id="clipStatus" class="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const API = "https://svfvg7xh9g.execute-api.eu-central-1.amazonaws.com/prod";
const COGNITO_REGION = "eu-central-1";
const COGNITO_CLIENT_ID = "1r0n2cor1pgqvahfogs6cfno7s";

// Fetched from GET /cameras (backed by the "cameras" DynamoDB registry) after login,
// rather than hardcoded here -- a camera added through the registry shows up on next
// login with no client redeploy. "id" matches the KVS stream name / cameraId / systemd
// unit suffix (kvs-cam01.service etc, see agent.py's hyphen-stripping note) used
// throughout the backend.
let CAMERAS = [];

let idToken = null;
// Per-camera player/recording state, keyed by camera id -- populated once CAMERAS is
// fetched (see login()), since it used to be a handful of bare global variables back
// when this page only had one hardcoded camera.
const state = {};

function el(camera, base) { return document.getElementById(`${base}-${camera}`); }
function setStatus(camera, msg) { el(camera, "status").textContent = msg; }
function showOverlay(camera, msg) {
  const o = el(camera, "overlay");
  o.textContent = msg;
  o.classList.remove("hidden");
}
function hideOverlay(camera) { el(camera, "overlay").classList.add("hidden"); }

function teardownPlayer(camera) {
  const s = state[camera];
  if (s.hls) { s.hls.destroy(); s.hls = null; }
  const v = el(camera, "video");
  v.removeAttribute("src");
  v.load();
}

function renderCameraPanel(cam) {
  const div = document.createElement("div");
  div.className = "camera-panel";
  const modeLabel = cam.mode === "passthrough" ? "ONVIF, passthrough" : "USB, transcoded";
  div.innerHTML = `
    <h2>${cam.id}</h2>
    <p class="camera-subtitle">${modeLabel}${cam.hasIrControl ? " · IR control" : ""}</p>
    <div class="video-wrap">
      <video id="video-${cam.id}" controls autoplay muted playsinline></video>
      <div id="overlay-${cam.id}" class="overlay">Press Start to begin watching</div>
    </div>
    <p>
      <button onclick="cmd('${cam.id}','start')">Start</button>
      <button onclick="cmd('${cam.id}','stop')">Stop</button>
      <button onclick="load('${cam.id}')">Reload player</button>
    </p>
    <div id="status-${cam.id}" class="status"></div>

    ${cam.hasIrControl ? `
    <p>
      IR illumination:
      <button onclick="setIrMode('${cam.id}','AUTO')">Auto</button>
      <button onclick="setIrMode('${cam.id}','OFF')">Force Day (IR off)</button>
      <button onclick="setIrMode('${cam.id}','ON')">Force Night (IR on)</button>
      <span id="irStatus-${cam.id}" class="status"></span>
    </p>` : ""}

    <p>
      <button id="recordBtn-${cam.id}" onclick="toggleRecording('${cam.id}')">&#9679; Start Recording</button>
      <span id="recordStatus-${cam.id}" class="status"></span>
    </p>

    <div class="clips-section">
      <h3>Evidence clips
        <button onclick="loadClips('${cam.id}')" style="font-size:0.8rem">Refresh</button>
      </h3>
      <ul id="clipsList-${cam.id}" class="clips-list"></ul>
    </div>`;
  return div;
}

const TIER_LABEL = {
  STANDARD: "Standard", STANDARD_IA: "Standard-IA",
  DEEP_ARCHIVE: "Deep Archive", GLACIER: "Glacier", UNKNOWN: "Unknown",
};

// Cognito's InitiateAuth is a plain JSON HTTPS API -- no SDK needed, keeps this a
// single self-contained file. See: https://docs.aws.amazon.com/cognito/latest/developerguide/API_InitiateAuth.html
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("loginError");
  errorEl.textContent = "";
  try {
    const r = await fetch(`https://cognito-idp.${COGNITO_REGION}.amazonaws.com/`, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-amz-json-1.1",
        "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
      },
      body: JSON.stringify({
        AuthFlow: "USER_PASSWORD_AUTH",
        ClientId: COGNITO_CLIENT_ID,
        AuthParameters: { USERNAME: username, PASSWORD: password },
      }),
    });
    const data = await r.json();
    if (!r.ok || !data.AuthenticationResult) {
      errorEl.textContent = data.message || "Sign-in failed";
      return;
    }
    idToken = data.AuthenticationResult.IdToken;

    const camerasDiv = document.getElementById("cameras");
    camerasDiv.innerHTML = "<p>Loading cameras…</p>";
    const cr = await fetch(`${API}/cameras`, { headers: { Authorization: idToken } });
    const cdata = await cr.json();
    if (!cr.ok) {
      errorEl.textContent = "Could not load camera list: " + (cdata.error || cr.status);
      return;
    }
    CAMERAS = cdata.cameras;

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";

    camerasDiv.innerHTML = "";
    for (const cam of CAMERAS) {
      state[cam.id] = { hls: null, userStopped: true, recording: false, recordingStartTs: null, recordingTimer: null };
      camerasDiv.appendChild(renderCameraPanel(cam));
      loadClips(cam.id);
    }
  } catch (e) {
    errorEl.textContent = "Network error: " + e.message;
  }
}

async function load(camera) {
  setStatus(camera, "loading stream...");
  showOverlay(camera, "Loading stream…");
  try {
    const r = await fetch(`${API}/hls?stream=${camera}`, { headers: { Authorization: idToken } });
    const data = await r.json();
    if (!r.ok) {
      setStatus(camera, "error: " + (data.error || r.status));
      showOverlay(camera, (data.error || "Could not load stream") + "\n\nPress Start to begin.");
      return;
    }
    const { url } = data;
    const v = el(camera, "video");
    const s = state[camera];

    if (s.hls) { s.hls.destroy(); s.hls = null; }
    s.userStopped = false;

    if (Hls.isSupported()) {
      s.hls = new Hls();
      s.hls.loadSource(url);
      s.hls.attachMedia(v);
      s.hls.on(Hls.Events.FRAG_BUFFERED, () => hideOverlay(camera));
      s.hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (s.userStopped) return;
        setStatus(camera, "player error: " + data.details);
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            s.hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            s.hls.recoverMediaError();
            break;
          default:
            showOverlay(camera, "Playback error (" + data.details + ")\n\nPress Reload player to retry.");
        }
      });
    } else {
      v.src = url;
      hideOverlay(camera);
    }
    setStatus(camera, "stream loaded");
  } catch (e) {
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Error loading stream.\n\nPress Reload player to retry.");
  }
}

async function cmd(camera, action) {
  setStatus(camera, `sending ${action}...`);
  const s = state[camera];
  if (action === "stop") {
    s.userStopped = true;
    teardownPlayer(camera);
    showOverlay(camera, "Stream stopped.\n\nPress Start to watch again.");
  } else {
    showOverlay(camera, "Starting stream…\nThis can take a few seconds.");
  }
  try {
    const r = await fetch(`${API}/cmd`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ action, camera }),
    });
    const data = await r.json();
    setStatus(camera, r.ok ? `${action} sent` : "error: " + (data.error || r.status));
    if (!r.ok) { showOverlay(camera, "Could not send " + action + ": " + (data.error || r.status)); return; }
    if (action === "start") setTimeout(() => load(camera), 8000);
  } catch (e) {
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Network error sending " + action + ".\n\nPress Start to try again.");
  }
}

async function setIrMode(camera, mode) {
  const statusEl = document.getElementById(`irStatus-${camera}`);
  statusEl.textContent = `setting ${mode}...`;
  try {
    const r = await fetch(`${API}/cmd`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ action: "ir", camera, mode }),
    });
    const data = await r.json();
    statusEl.textContent = r.ok ? `IR mode: ${mode}` : "error: " + (data.error || r.status);
  } catch (e) {
    statusEl.textContent = "error: " + e.message;
  }
}

function toggleRecording(camera) {
  state[camera].recording ? stopRecording(camera) : startRecording(camera);
}

function startRecording(camera) {
  const s = state[camera];
  s.recording = true;
  s.recordingStartTs = new Date();
  const btn = document.getElementById(`recordBtn-${camera}`);
  btn.textContent = "■ Stop Recording";
  btn.style.background = "#c0392b";
  btn.style.color = "#fff";

  const statusEl = document.getElementById(`recordStatus-${camera}`);
  s.recordingTimer = setInterval(() => {
    const secs = Math.floor((new Date() - s.recordingStartTs) / 1000);
    statusEl.textContent = `Recording… ${secs}s`;
  }, 1000);
}

async function stopRecording(camera) {
  const s = state[camera];
  s.recording = false;
  clearInterval(s.recordingTimer);
  const endTs = new Date();
  const btn = document.getElementById(`recordBtn-${camera}`);
  const statusEl = document.getElementById(`recordStatus-${camera}`);
  btn.textContent = "● Start Recording";
  btn.style.background = "";
  btn.style.color = "";
  statusEl.textContent = "Saving recording…";

  try {
    const r = await fetch(`${API}/clips/record`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({
        stream: camera,
        startTs: s.recordingStartTs.toISOString(),
        endTs: endTs.toISOString(),
      }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = "Error saving recording: " + (data.error || r.status);
      return;
    }
    statusEl.textContent = "Recording saved.";
    loadClips(camera);
  } catch (e) {
    statusEl.textContent = "Network error saving recording: " + e.message;
  }
}

async function loadClips(camera) {
  const list = document.getElementById(`clipsList-${camera}`);
  list.innerHTML = "<li>Loading…</li>";
  try {
    const r = await fetch(`${API}/clips?camera=${camera}`, { headers: { Authorization: idToken } });
    const data = await r.json();
    if (!r.ok) { list.innerHTML = `<li>Error: ${data.error || r.status}</li>`; return; }
    if (data.clips.length === 0) { list.innerHTML = "<li>No clips yet.</li>"; return; }

    list.innerHTML = "";
    for (const clip of data.clips) {
      const li = document.createElement("li");
      const when = new Date(clip.startTs).toLocaleString();
      const tierClass = "tier-" + clip.tier;
      const tierText = TIER_LABEL[clip.tier] || clip.tier;
      const restoreNote = clip.restoring ? " (restoring…)" : "";
      const duration = clip.durationSec != null ? `${clip.durationSec} sec.` : "duration unknown";
      li.innerHTML = `
        <span class="tier-badge ${tierClass}">${tierText}${restoreNote}</span>
        <span class="clip-meta">${when}
          <span class="clip-duration">· ${duration}</span>
          <span class="clip-labels">${(clip.labels || []).join(", ")}</span>
        </span>
        <select class="tier-select">
          <option value="STANDARD">Standard</option>
          <option value="STANDARD_IA">Standard-IA</option>
          <option value="DEEP_ARCHIVE">Deep Archive</option>
        </select>
        <button class="tier-apply-btn">Apply</button>
        <button class="play-btn">Play</button>
        <button class="delete-btn" style="background:#c0392b; color:#fff">Delete</button>
        <span class="tier-apply-status"></span>`;
      li.querySelector(".tier-select").value =
        (clip.tier === "GLACIER" ? "DEEP_ARCHIVE" : clip.tier) || "STANDARD";
      li.querySelector(".tier-apply-btn").onclick =
        () => setClipTier(clip.s3Key, li.querySelector(".tier-select").value, li, camera);
      li.querySelector(".delete-btn").onclick =
        () => deleteClip(clip.s3Key, clip.startTs, when, li, camera);
      li.querySelector(".play-btn").onclick = () => playClip(clip.s3Key);
      list.appendChild(li);
    }
  } catch (e) {
    list.innerHTML = `<li>Error: ${e.message}</li>`;
  }
}

async function setClipTier(s3Key, tier, li, camera) {
  const statusEl = li.querySelector(".tier-apply-status");
  statusEl.textContent = "Applying…";
  try {
    const r = await fetch(`${API}/clips/tier`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key, tier }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = data.error || `Error (${r.status})`;
      return;
    }
    statusEl.textContent = "Done.";
    loadClips(camera);
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

async function deleteClip(s3Key, startTs, when, li, camera) {
  if (!confirm(`Delete the clip from ${when}?\n\nThis cannot be undone.`)) return;

  const statusEl = li.querySelector(".tier-apply-status");
  statusEl.textContent = "Deleting…";
  try {
    const r = await fetch(`${API}/clips/delete`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key, startTs }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = "Error: " + (data.error || r.status);
      return;
    }
    closeClipPlayer();
    li.remove();
    const list = document.getElementById(`clipsList-${camera}`);
    if (list.children.length === 0) list.innerHTML = "<li>No clips yet.</li>";
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

// One shared player for saved clips, regardless of which camera panel's Play button
// was pressed -- only one clip is ever being reviewed at a time, so a per-camera
// player would just be two empty players sitting around.
async function playClip(s3Key) {
  const section = document.getElementById("clipPlayerSection");
  const player = document.getElementById("clipPlayer");
  const statusEl = document.getElementById("clipStatus");
  section.style.display = "block";
  player.pause(); player.removeAttribute("src"); player.load();
  statusEl.textContent = "Loading clip…";
  section.scrollIntoView({ behavior: "smooth" });

  try {
    const r = await fetch(`${API}/clips/play`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key }),
    });
    const data = await r.json();
    if (!r.ok && r.status !== 202) {
      statusEl.textContent = "Error: " + (data.error || r.status);
      return;
    }
    if (data.status === "ready") {
      player.src = data.url;
      statusEl.textContent = "";
      player.play().catch(() => {
        statusEl.textContent = "Loaded -- press the player's play button to watch.";
      });
    } else if (data.status === "restore_requested") {
      statusEl.textContent = `This clip is in Deep Archive and wasn't readable directly. ` +
        `A restore has been requested -- check back in about ${data.eta_hours} hours ` +
        `and press Play again.`;
    } else if (data.status === "restoring") {
      statusEl.textContent = `Restore already in progress -- check back in about ` +
        `${data.eta_hours} hours and press Play again.`;
    }
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

function closeClipPlayer() {
  const player = document.getElementById("clipPlayer");
  player.pause();
  player.removeAttribute("src");
  player.load();
  document.getElementById("clipStatus").textContent = "";
  document.getElementById("clipPlayerSection").style.display = "none";
}

document.getElementById("login").style.display = "block";
</script>
</body>
</html>
